name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --extra dev --python "${{ matrix.python-version }}"

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy src tests

      - name: Build distributions
        if: matrix.python-version == '3.13'
        run: uv build

      - name: Check distributions
        if: matrix.python-version == '3.13'
        run: uv run twine check dist/*

  fastapi-capabilities:
    name: FastAPI ${{ matrix.fastapi-version }} capabilities
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fastapi-version:
          - "0.121.0"
          - "0.128.0"
          - "0.139.2"
          - "0.141.1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Check FastAPI capabilities
        run: >-
          uv run --no-project
          --with "fastapi==${{ matrix.fastapi-version }}"
          python tests/spike/check_fastapi_compat.py
