[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fastapi-lens"
version = "0.1.0a0"
description = "A FastAPI-aware request execution profiler"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "fastapi-lens contributors" },
]
keywords = [
    "fastapi",
    "observability",
    "performance",
    "profiler",
    "sqlalchemy",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.121.0,<0.142.0",
]

[project.optional-dependencies]
sqlalchemy = [
    "sqlalchemy[asyncio]>=2.0",
]
dev = [
    "aiosqlite>=0.21",
    "build>=1.3",
    "httpx2>=2.7",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "sqlalchemy[asyncio]>=2.0",
    "twine>=6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_lens"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=fastapi_lens",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["fastapi_lens"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["fastapi_lens"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
show_error_codes = true
warn_unreachable = true
